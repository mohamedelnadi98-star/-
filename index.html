<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكي التاجر الواقعي - مصر - Realistic Trader Simulator Pro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap');

        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --panel-border: #334155;
            --accent-gold: #f59e0b;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-purple: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; user-select: none; }

        body {
            background-color: #020617;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 1150px;
            height: 700px;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-radius: 16px;
            border: 2px solid var(--panel-border);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        .screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg-dark); z-index: 10; }
        .screen.hidden { display: none !important; }

        .menu-btn {
            width: 280px; padding: 12px 20px; background: var(--panel-bg); border: 2px solid var(--panel-border);
            color: var(--text-main); border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.2s;
        }
        .menu-btn:hover { border-color: var(--accent-blue); color: var(--accent-blue); transform: translateY(-2px); }
        .menu-btn.primary { background: var(--accent-gold); color: #000; border-color: var(--accent-gold); }

        .modal-overlay {
            position: absolute; inset: 0; background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center; z-index: 200;
        }
        .modal-overlay.hidden { display: none !important; }
        
        .modal-card {
            background: var(--panel-bg); border: 2px solid var(--accent-gold); padding: 30px; border-radius: 16px;
            width: 400px; text-align: center; display: flex; flex-direction: column; gap: 18px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.7); animation: slideIn 0.3s ease;
        }
        .modal-input {
            width: 100%; padding: 12px; border-radius: 10px; border: 1.5px solid var(--panel-border);
            background: #0f172a; color: var(--text-main); font-size: 1.1rem; text-align: center; font-weight: 700;
            outline: none; transition: all 0.2s;
        }
        .modal-input:focus { border-color: var(--accent-gold); box-shadow: 0 0 10px rgba(245, 158, 11, 0.3); }

        .top-bar { background: rgba(15, 23, 42, 0.95); border-bottom: 2px solid var(--panel-border); padding: 10px 24px; display: flex; justify-content: space-between; align-items: center; }
        .stats-group { display: flex; gap: 8px; flex-wrap: wrap; }
        .stat-pill { background: var(--panel-bg); border: 1px solid var(--panel-border); padding: 5px 12px; border-radius: 20px; font-size: 0.82rem; font-weight: 700; }

        .month-progress-bar {
            width: 100px; height: 8px; background: #0f172a; border-radius: 4px; overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 5px; border: 1px solid var(--panel-border);
        }
        .month-progress-fill { height: 100%; background: var(--accent-gold); width: 0%; transition: width 1s linear; }

        .dashboard-layout { display: grid; grid-template-columns: 240px 1fr; height: calc(100% - 65px); }

        .sidebar { background: rgba(15, 23, 42, 0.6); border-left: 2px solid var(--panel-border); padding: 15px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
        
        .nav-btn {
            background: var(--panel-bg); border: 1.5px solid var(--panel-border); color: var(--text-main);
            padding: 10px 14px; border-radius: 10px; font-size: 0.88rem; font-weight: 700; cursor: pointer;
            text-align: right; display: flex; align-items: center; justify-content: space-between; transition: all 0.2s;
        }
        .nav-btn:hover { border-color: var(--accent-blue); background: rgba(59, 130, 246, 0.1); }
        .nav-btn.active {
            border-color: var(--accent-gold) !important;
            background: rgba(245, 158, 11, 0.15) !important;
            color: var(--accent-gold) !important;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.2);
        }

        .main-content { padding: 25px; overflow-y: auto; height: 100%; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; margin-top: 15px; }
        
        .info-card {
            background: var(--panel-bg); border: 1.5px solid var(--panel-border); border-radius: 12px;
            padding: 18px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            position: relative;
        }
        .card-title { font-size: 1.05rem; font-weight: 800; color: var(--accent-gold); display: flex; justify-content: space-between; align-items: center; }
        
        .action-btn {
            background: var(--accent-blue); color: #fff; border: none; padding: 10px; border-radius: 8px;
            font-weight: 700; cursor: pointer; transition: all 0.2s; margin-top: auto;
        }
        .action-btn:hover { background: #2563eb; }
        .action-btn.buy-btn { background: var(--accent-green); color: #000; }
        .action-btn.buy-btn:hover { background: #059669; color: #fff; }
        .action-btn.upgrade-btn { background: var(--accent-gold); color: #000; }
        .action-btn.danger-btn { background: var(--accent-red); color: #fff; }
        .action-btn:disabled { background: #475569 !important; color: #94a3b8 !important; cursor: not-allowed; }

        .status-badge { padding: 3px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 800; }
        .badge-owned { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
        .badge-locked { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }

        #toast-container { position: absolute; bottom: 20px; left: 20px; z-index: 300; display: flex; flex-direction: column; gap: 10px; }
        .toast-msg {
            background: rgba(30, 41, 59, 0.95); border: 1.5px solid var(--accent-blue); color: var(--text-main);
            padding: 12px 20px; border-radius: 10px; font-size: 0.9rem; font-weight: 700;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5); animation: slideIn 0.3s ease forwards; display: flex; align-items: center; gap: 10px;
        }
        .toast-msg.error { border-color: var(--accent-red); }
        .toast-msg.success { border-color: var(--accent-green); }

        @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

<div id="game-container">

    <!-- نافذة طلب اسم التاجر عند البداية -->
    <div class="modal-overlay" id="name-modal">
        <div class="modal-card">
            <h2 style="color:var(--accent-gold);">📜 سجل اسمك التجاري</h2>
            <p style="font-size:0.9rem; color:var(--text-muted);">اكتب اسمك لتصبح التاجر الرسمي للشركة ومقرها الرئيسي دمياط</p>
            <input type="text" id="player-name-input" class="modal-input" placeholder="اكتب اسمك هنا..." maxlength="20">
            <button class="menu-btn primary" style="width:100%;" onclick="confirmPlayerName()">دخول السوق والبدء 🚀</button>
        </div>
    </div>

    <!-- شاشة اللعبة والداشبورد -->
    <div class="screen hidden" id="dashboard-screen">
        <div class="top-bar">
            <div style="font-weight:800; color:var(--accent-gold);">🏢 شركة <span id="display-player-name">التاجر</span> للتوزيع (دمياط)</div>
            <div class="stats-group">
                <div class="stat-pill">📅 شهر: <b id="game-month" style="color:var(--accent-blue)">1</b> <div class="month-progress-bar"><div class="month-progress-fill" id="month-progress"></div></div></div>
                <div class="stat-pill">⭐ المستوى: <b id="player-lvl" style="color:var(--accent-gold)">1</b></div>
                <div class="stat-pill">💰 الخزينة: <b id="player-money" style="color:var(--accent-green)">500,000 ج.م</b></div>
                <div class="stat-pill">🏦 القروض: <b id="player-loan" style="color:var(--accent-red)">0 ج.م</b></div>
                <div class="stat-pill">🚚 الشاحنات: <b id="trucks-status" style="color:var(--accent-blue)">0 / 0</b></div>
                <div class="stat-pill">📦 المخزن: <b id="wh-capacity">0 / 0</b></div>
            </div>
        </div>

        <div class="dashboard-layout">
            <div class="sidebar">
                <div style="font-size:0.75rem; color:var(--text-muted); font-weight:800;">الإدارات الرئيسيّة</div>
                <button class="nav-btn active" id="btn-admin" onclick="showTab('admin', this)">👔 إدارة المدير <span>🔓</span></button>
                <button class="nav-btn" id="btn-map" onclick="showTab('map', this)">🗺️ خريطة المحافظات <span>🇪🇬</span></button>
                <button class="nav-btn" id="btn-sales" onclick="showTab('sales', this)">📈 إدارة المبيعات <span>🔓</span></button>
                <button class="nav-btn" id="btn-hr" onclick="showTab('hr', this)">👥 إدارة التوظيف <span>🔓</span></button>
                <button class="nav-btn" id="btn-marketing" onclick="showTab('marketing', this)">📢 إدارة التسويق <span>🔓</span></button>
                <button class="nav-btn" id="btn-finance" onclick="showTab('finance', this)">📑 الحسابات والبنك <span>🔓</span></button>

                <div style="font-size:0.75rem; color:var(--text-muted); font-weight:800; margin-top:10px;">أصول الشركة والعمليات</div>
                <button class="nav-btn" id="btn-company" onclick="showTab('company', this)">🏢 مقر الشركة (دمياط)</button>
                <button class="nav-btn" id="btn-warehouse" onclick="showTab('warehouse', this)">🏭 المخزن والبضائع</button>
                <button class="nav-btn" id="btn-fleet" onclick="showTab('fleet', this)">🚚 أسطول السيارات</button>
                <button class="nav-btn" id="btn-contracts" onclick="showTab('contracts', this)">📄 العقود والشركات</button>
                <button class="nav-btn" id="btn-deals" onclick="showTab('deals', this)">🤝 السوق والصفقات الحية</button>
                
                <div style="font-size:0.75rem; color:var(--text-muted); font-weight:800; margin-top:10px;">أمان البيانات</div>
                <button class="nav-btn" id="btn-settings" onclick="showTab('settings', this)">🛡️ حماية التقدم <span>🔒</span></button>
            </div>

            <div class="main-content" id="tab-content"></div>
        </div>
    </div>

    <div id="toast-container"></div>
</div>

<script>
    const GAME_VERSION = "2.4.0";
    const SAVE_KEY_PRIMARY = 'trader_real_save_v3';
    const SAVE_KEY_BACKUP = 'trader_real_save_backup_v3';
    const MONTH_DURATION_SECONDS = 60; 
    const WAREHOUSE_EXPAND_COST = 50000; 

    const governoratesData = [
        { id: 'domyat', name: 'دمياط (المقر الرئيسي)', minLvl: 1, cost: 0, unlocked: true, bonus: 0, deliveryTime: 10 },
        { id: 'dakahlia', name: 'الدقهلية (المنصورة)', minLvl: 2, cost: 120000, unlocked: false, bonus: 0.20, deliveryTime: 15 },
        { id: 'sharqia', name: 'الشرقية (الزقازيق)', minLvl: 3, cost: 250000, unlocked: false, bonus: 0.20, deliveryTime: 20 },
        { id: 'cairo', name: 'القاهرة الكبرى', minLvl: 4, cost: 500000, unlocked: false, bonus: 0.30, deliveryTime: 30 },
        { id: 'alex', name: 'الإسكندرية', minLvl: 5, cost: 800000, unlocked: false, bonus: 0.35, deliveryTime: 35 }
    ];

    const defaultGameState = {
        version: GAME_VERSION,
        playerName: 'تاجر جديد',
        level: 1,
        money: 500000,
        loan: 0,
        month: 1,
        monthProgressTimer: 0,
        marketingLevel: 0,
        marketingMultiplier: 1,
        office: { owned: false, level: 1 },
        warehouse: { owned: false, level: 1, capacity: 0, stock: { dairy: 0, cleaners: 0 } },
        trucks: 0,
        activeDeliveries: [], // التوصيلات والشاحنات المشغولة حالياً
        staff: { drivers: 0, reps: [] },
        signedContracts: { dairy: false, cleaners: false },
        governorates: governoratesData,
        marketDeals: [],
        currentTab: 'admin',
        totalRevenueGenerated: 0,
        lastSavedTime: Date.now()
    };

    let gameState = JSON.parse(JSON.stringify(defaultGameState));
    const clientNames = ["سوبرماركت التقوى", "هايبر الأمل", "أسواق مكة", "ماركت الأمانة", "سلسلة الجملة", "ميني ماركت البركة", "أسواق المدينة"];

    window.addEventListener('DOMContentLoaded', () => {
        const hasSaved = loadGameData(false);
        if(!hasSaved) {
            document.getElementById('name-modal').classList.remove('hidden');
            document.getElementById('player-name-input').focus();
        }
    });

    window.addEventListener('beforeunload', () => {
        saveGameData(false);
    });

    // العداد التكراري للعبة والشهر التجاري وإدارة الرحلات
    setInterval(() => {
        if (!document.getElementById('dashboard-screen').classList.contains('hidden')) {
            gameState.monthProgressTimer++;
            const progressPercent = (gameState.monthProgressTimer / MONTH_DURATION_SECONDS) * 100;
            document.getElementById('month-progress').style.width = `${progressPercent}%`;

            if (gameState.monthProgressTimer >= MONTH_DURATION_SECONDS) {
                gameState.monthProgressTimer = 0;
                processMonthlyExpenses();
            }

            processDeliveries();
            generateMarketDeal();
            runAIReps();
            checkLevelProgress();
            saveGameData(false);
        }
    }, 1000);

    function processDeliveries() {
        if (!gameState.activeDeliveries || gameState.activeDeliveries.length === 0) return;

        for (let i = gameState.activeDeliveries.length - 1; i >= 0; i--) {
            let delivery = gameState.activeDeliveries[i];
            delivery.timeLeft--;

            if (delivery.timeLeft <= 0) {
                // الشحنة وصلت بنجاح وتفريغ الشاحنة واستلام الأرباح
                gameState.money += delivery.totalRevenue;
                gameState.totalRevenueGenerated += delivery.totalRevenue;

                if (delivery.repIndex !== undefined && gameState.staff.reps[delivery.repIndex]) {
                    let rep = gameState.staff.reps[delivery.repIndex];
                    let commission = Math.round(delivery.totalRevenue * 0.04);
                    rep.unpaidCommission += commission;
                    rep.totalSales += delivery.totalRevenue;
                }

                showToast(`🚚 عادت الشاحنة من رحلتها لـ (${delivery.govName})! تم تسليم البضاعة وتحصيل ${delivery.totalRevenue.toLocaleString()} ج.م أرباح.`, "success");
                gameState.activeDeliveries.splice(i, 1);
                updateUI();
                if (gameState.currentTab === 'fleet' || gameState.currentTab === 'deals') showTab(gameState.currentTab);
            }
        }
    }

    function processMonthlyExpenses() {
        gameState.month++;
        const driverSalaries = gameState.staff.drivers * 4000;
        const repSalaries = gameState.staff.reps.length * 3500;
        const truckMaintenance = gameState.trucks * 2500;
        const loanInterest = gameState.loan > 0 ? 11000 : 0;

        const totalExpenses = driverSalaries + repSalaries + truckMaintenance + loanInterest;
        gameState.money -= totalExpenses;

        document.getElementById('game-month').innerText = gameState.month;
        updateUI();
        showToast(`📆 انتهى الشهر ${gameState.month - 1}! تم خصم الرواتب والصيانة والفوائد بمبلغ ${totalExpenses.toLocaleString()} ج.م من الخزينة.`, "error");
        
        if (gameState.currentTab === 'admin') showTab('admin');
    }

    function confirmPlayerName() {
        const inputVal = document.getElementById('player-name-input').value.trim();
        const finalName = inputVal ? `التاجر ${inputVal}` : 'التاجر الجديد';
        
        gameState.playerName = finalName;

        document.getElementById('name-modal').classList.add('hidden');
        document.getElementById('dashboard-screen').classList.remove('hidden');

        showTab('admin', document.getElementById('btn-admin'));
        updateUI();
        saveGameData(false);
        showToast(`أهلاً بك يا ${gameState.playerName}! ابدأ تأسيس تجارتك من مقرك الرئيسي بدمياط.`, "success");
    }

    function getAvailableTrucks() {
        const busyTrucks = gameState.activeDeliveries ? gameState.activeDeliveries.length : 0;
        return Math.max(0, gameState.trucks - busyTrucks);
    }

    function updateUI() {
        document.getElementById('display-player-name').innerText = gameState.playerName;
        document.getElementById('player-money').innerText = gameState.money.toLocaleString() + " ج.م";
        document.getElementById('player-loan').innerText = gameState.loan.toLocaleString() + " ج.م";
        document.getElementById('player-lvl').innerText = gameState.level;
        document.getElementById('game-month').innerText = gameState.month;
        
        const availableTrucks = getAvailableTrucks();
        document.getElementById('trucks-status').innerText = `${availableTrucks} متاحة / ${gameState.trucks}`;

        const totalStock = (gameState.warehouse.stock?.dairy || 0) + (gameState.warehouse.stock?.cleaners || 0);
        document.getElementById('wh-capacity').innerText = `${totalStock} / ${gameState.warehouse.capacity || 0}`;
    }

    function checkLevelProgress() {
        const newLevel = Math.floor(gameState.totalRevenueGenerated / 250000) + 1;
        if (newLevel > gameState.level) {
            gameState.level = newLevel;
            showToast(`🎉 مبروك يا ${gameState.playerName}! ارتفع مستواك الفعلي إلى Level ${gameState.level}! يمكنك فتح محافظات جديدة الآن!`, "success");
            updateUI();
        }
    }

    function showToast(message, type = "info") {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast-msg ${type}`;
        let icon = type === "success" ? "✅" : (type === "error" ? "⚠️" : "🔔");
        toast.innerHTML = `<span>${icon}</span> <span>${message}</span>`;
        container.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateX(-100%)';
            toast.style.transition = 'all 0.3s ease';
            setTimeout(() => toast.remove(), 300);
        }, 3200);
    }

    function generateMarketDeal() {
        if (!gameState.office.owned) return;
        
        if (gameState.marketDeals.length >= (5 + gameState.marketingLevel)) gameState.marketDeals.shift();

        const unlockedGovs = gameState.governorates.filter(g => g.unlocked);
        if (unlockedGovs.length === 0) return;
        const selectedGov = unlockedGovs[Math.floor(Math.random() * unlockedGovs.length)];

        const products = [];
        if (gameState.signedContracts.dairy) products.push({ id: 'dairy', name: 'ألبان', buyPrice: 18, baseSell: 22 });
        if (gameState.signedContracts.cleaners) products.push({ id: 'cleaners', name: 'منظفات', buyPrice: 40, baseSell: 52 });

        if (products.length === 0) return;

        const prod = products[Math.floor(Math.random() * products.length)];
        const client = clientNames[Math.floor(Math.random() * clientNames.length)];
        const qty = (Math.floor(Math.random() * 4) + 1) * 20; 
        
        const priceVariance = Math.floor(Math.random() * 6) - 2; 
        let pricePerUnit = prod.baseSell + priceVariance;
        
        let totalRev = Math.round(qty * pricePerUnit * gameState.marketingMultiplier * (1 + selectedGov.bonus));

        const newDeal = {
            id: Date.now(),
            govId: selectedGov.id,
            govName: selectedGov.name,
            deliveryTime: selectedGov.deliveryTime || 15,
            client: client,
            product: prod.id,
            productName: prod.name,
            qty: qty,
            pricePerUnit: pricePerUnit,
            totalRevenue: totalRev
        };

        gameState.marketDeals.push(newDeal);
        if (gameState.currentTab === 'deals') showTab('deals');
    }

    function runAIReps() {
        if (!gameState.staff.reps || gameState.staff.reps.length === 0 || gameState.marketDeals.length === 0) return;

        const availableTrucks = getAvailableTrucks();
        if (availableTrucks <= 0 || gameState.staff.drivers <= gameState.activeDeliveries.length) return;

        gameState.staff.reps.forEach((rep, repIndex) => {
            const successRate = 0.20 + (rep.skill * 0.08); 
            if (Math.random() < successRate && gameState.marketDeals.length > 0 && getAvailableTrucks() > 0) {
                const dealIndex = Math.floor(Math.random() * gameState.marketDeals.length);
                const deal = gameState.marketDeals[dealIndex];

                if (gameState.warehouse.stock[deal.product] >= deal.qty) {
                    // خصم المخزون وبدء عملية الشحن
                    gameState.warehouse.stock[deal.product] -= deal.qty;

                    gameState.activeDeliveries.push({
                        id: Date.now(),
                        client: deal.client,
                        govName: deal.govName,
                        totalRevenue: deal.totalRevenue,
                        timeLeft: deal.deliveryTime,
                        totalTime: deal.deliveryTime,
                        repIndex: repIndex
                    });

                    gameState.marketDeals.splice(dealIndex, 1);
                    showToast(`🤖 المندوب (${rep.name}) خرج بشاحنة لتوصيل طلب لـ ${deal.govName}!`, "info");
                    updateUI();
                    if (gameState.currentTab === 'sales' || gameState.currentTab === 'deals' || gameState.currentTab === 'fleet') showTab(gameState.currentTab);
                }
            }
        });
    }

    function unlockGovernorate(govId) {
        const gov = gameState.governorates.find(g => g.id === govId);
        if(!gov) return;

        if (gameState.level < gov.minLvl) return showToast(`يجب الوصول للمستوى ${gov.minLvl} أولاً لفتح هذه المحافظة!`, "error");
        if (gameState.money < gov.cost) return showToast(`الرصيد غير كاف لشراء التوسع في ${gov.name}!`, "error");

        gameState.money -= gov.cost;
        gov.unlocked = true;
        updateUI();
        showToast(`🎉 تم فتح التوزيع الرسمي في ${gov.name}! زيادة أرباح الصفقات +${gov.bonus * 100}%`, "success");
        showTab('map');
    }

    function expandWarehouseCapacity() {
        if (gameState.money < WAREHOUSE_EXPAND_COST) {
            return showToast(`الرصيد غير كاف لتوسعة المخزن! تحتاج ${WAREHOUSE_EXPAND_COST.toLocaleString()} ج.م`, "error");
        }

        gameState.money -= WAREHOUSE_EXPAND_COST;
        gameState.warehouse.capacity += 300;
        updateUI();
        showToast(`📦 تم توسعة المخزن بنجاح! السعة الجديدة: ${gameState.warehouse.capacity} كرتونة`, "success");
        showTab('warehouse');
    }

    function buyWarehouse(cost, cap) {
        if(gameState.money < cost) return showToast("الرصيد غير كاف لشراء المخزن!", "error");
        gameState.money -= cost;
        gameState.warehouse.owned = true;
        gameState.warehouse.capacity = cap;
        updateUI();
        showToast("🏭 تم شراء أول مخزن لك بنجاح!", "success");
        showTab('warehouse');
    }

    function buyStock(product, pricePerUnit, count) {
        const totalCost = pricePerUnit * count;
        const currentStock = (gameState.warehouse.stock.dairy || 0) + (gameState.warehouse.stock.cleaners || 0);
        if(currentStock + count > gameState.warehouse.capacity) return showToast("المخزن لا يتسع لهذة الكمية!", "error");
        if(gameState.money < totalCost) return showToast("الرصيد غير كاف لشراء البضاعة!", "error");

        gameState.money -= totalCost;
        gameState.warehouse.stock[product] = (gameState.warehouse.stock[product] || 0) + count;
        updateUI();
        showToast(`📦 تم شراء ${count} كرتونة بضاعة بنجاح!`, "success");
        showTab('warehouse');
    }

    function buyOffice(cost) {
        if(gameState.money < cost) return showToast("الرصيد غير كاف لشراء المقر!", "error");
        gameState.money -= cost;
        gameState.office.owned = true;
        updateUI();
        showToast("🏢 تم تأسيس المقر الرئيسي بدمياط بنجاح!", "success");
        showTab('company');
    }

    function upgradeOffice(cost) {
        if(gameState.money < cost) return showToast("الرصيد غير كاف للتطوير!", "error");
        gameState.money -= cost;
        gameState.office.level++;
        updateUI();
        showToast("✨ تم تطوير المقر الرئيسي!", "success");
        showTab('company');
    }

    function buyTruck() {
        const cost = 80000;
        if(gameState.money < cost) return showToast("الرصيد غير كاف لشراء شاحنة!", "error");
        gameState.money -= cost;
        gameState.trucks++;
        updateUI();
        showToast("🚚 تم إضافة شاحنة جديدة للأسطول!", "success");
        showTab('fleet');
    }

    function hireDriver() {
        const cost = 5000;
        if(gameState.money < cost) return showToast("الرصيد غير كاف لتعيين سائق!", "error");
        gameState.money -= cost;
        gameState.staff.drivers++;
        updateUI();
        showToast("👨‍✈️ تم تعيين سائق جديد!", "success");
        showTab('hr');
    }

    function hireRep() {
        const cost = 10000;
        if(gameState.money < cost) return showToast("الرصيد غير كاف لتعيين مندوب!", "error");
        gameState.money -= cost;
        const names = ["أحمد", "محمود", "إبراهيم", "سيد", "مصطفى", "حسن", "علي"];
        const randomName = names[Math.floor(Math.random() * names.length)];
        gameState.staff.reps.push({
            name: randomName,
            skill: Math.floor(Math.random() * 3) + 1,
            totalSales: 0,
            unpaidCommission: 0
        });
        updateUI();
        showToast("👨‍💼 تم تعيين مندوب مبيعات جديد!", "success");
        showTab('hr');
    }

    function payCommission(index) {
        const rep = gameState.staff.reps[index];
        if(!rep || rep.unpaidCommission <= 0) return showToast("لا يوجد عمولة مستحقة للصرف!", "error");
        if(gameState.money < rep.unpaidCommission) return showToast("الرصيد غير كاف لصرف العمولة!", "error");

        gameState.money -= rep.unpaidCommission;
        showToast(`💸 تم صرف مبلغ ${rep.unpaidCommission.toLocaleString()} ج.م للمندوب ${rep.name}`, "success");
        rep.unpaidCommission = 0;
        updateUI();
        showTab('sales');
    }

    function signContract(type, cost) {
        if(gameState.money < cost) return showToast("الرصيد غير كاف لتوقيع العقد!", "error");
        gameState.money -= cost;
        gameState.signedContracts[type] = true;
        updateUI();
        showToast("📄 تم توقيع عقد التوريد بنجاح!", "success");
        showTab('contracts');
    }

    function executeManualDeal(dealId) {
        const dealIndex = gameState.marketDeals.findIndex(d => d.id === dealId);
        if(dealIndex === -1) return;
        const deal = gameState.marketDeals[dealIndex];

        const availableTrucks = getAvailableTrucks();
        if(gameState.trucks <= 0) return showToast("لا تملك أي شاحنات لشحن الطلبات!", "error");
        if(availableTrucks <= 0) return showToast("جميع شاحناتك مشغولة حالياً في رحلات توصيل أخرى!", "error");
        if(gameState.staff.drivers <= gameState.activeDeliveries.length) return showToast("لا يوجد سائق متاح حالياً!", "error");
        if((gameState.warehouse.stock[deal.product] || 0) < deal.qty) return showToast("البضاعة غير متوفرة في المخزن لهذا الطلب!", "error");

        // خصم البضاعة وبدء رحلة التوصيل
        gameState.warehouse.stock[deal.product] -= deal.qty;
        
        gameState.activeDeliveries.push({
            id: Date.now(),
            client: deal.client,
            govName: deal.govName,
            totalRevenue: deal.totalRevenue,
            timeLeft: deal.deliveryTime,
            totalTime: deal.deliveryTime
        });

        gameState.marketDeals.splice(dealIndex, 1);

        updateUI();
        showToast(`🚚 خرجت الشاحنة لتوصيل الطلب إلى ${deal.govName}! استغراق الرحلة: ${deal.deliveryTime} ثوانٍ`, "success");
        showTab('deals');
    }

    function buyMarketing(lvl, cost, mult) {
        if(gameState.money < cost) return showToast("الرصيد غير كاف لتمويل الحملة!", "error");
        gameState.money -= cost;
        gameState.marketingLevel = lvl;
        gameState.marketingMultiplier = mult;
        updateUI();
        showToast("📢 تم إطلاق الحملة التسويقية بنجاح!", "success");
        showTab('marketing');
    }

    function takeLoan(amount) {
        if (gameState.loan > 0) {
            return showToast("لا يمكنك أخذ قرض جديد حتى تقوم بسداد القرض الحالي بالكامل!", "error");
        }
        gameState.money += amount;
        gameState.loan += amount;
        updateUI();
        showToast(`🏦 تم اقتراض ${amount.toLocaleString()} ج.م وإضافتها للخزينة.`, "success");
        showTab('finance');
    }

    function payLoan() {
        const amount = 50000;
        if(gameState.loan <= 0) return showToast("ليس عليك أي قروض حالياً!", "error");
        if(gameState.money < amount) return showToast("الرصيد غير كاف لسداد جزء من القرض!", "error");

        gameState.money -= amount;
        gameState.loan = Math.max(0, gameState.loan - amount);
        updateUI();
        showToast(`تم سداد ${amount.toLocaleString()} ج.م من القروض.`, "success");
        showTab('finance');
    }

        const name = prompt("ادخل الاسم التجاري الجديد:", gameState.playerName);

            showTab('admin');

                            <div>العائد المتوقع: <b style="color:var(--accent-green);">${del.totalRevenue.toLocaleString()} ج.م</b></div>
                            <div>متبقي للوصول: <b style="color:var(--accent-gold);">${del.timeLeft} ثانية</b></div>
                        </div>
                    `;
                });
            }

            content.innerHTML = `
                <h2>🚚 أسطول السيارات والنقل</h2>
                <p style="color:var(--text-muted);">زيادة شاحناتك تتيح لك إتمام عدة صفقات في نفس الوقت بدون التأخر في التوصيل</p>
                <div class="card-grid">
                    <div class="info-card">
                        <div class="card-title">شراء شاحنة نقل جديدة 🚛</div>
                        <div>السعر: <b>80,000 ج.م</b></div>
                        <div>صيانة شهرية: <b>2,500 ج.م</b></div>
                        <div>الأسطول الحالي: <b>${gameState.trucks} شاحنة (${getAvailableTrucks()} متاحة حالياً)</b></div>
                        <button class="action-btn buy-btn" onclick="buyTruck()">شراء شاحنة جديدة</button>
                    </div>
                </div>
                ${gameState.activeDeliveries && gameState.activeDeliveries.length > 0 ? `
                    <h3 style="margin-top:25px; color:var(--accent-gold);">🚦 الرحلات والشاحنات المشغولة حالياً (${gameState.activeDeliveries.length}):</h3>
                    <div class="card-grid">${activeDeliveriesHTML}</div>
                ` : ''}
            `;
        }
        else if(tabName === 'contracts') {
            content.innerHTML = `
                <h2>📄 العقود وتأمين المصانع</h2>
                <p style="color:var(--text-muted);">وقع عقود توريد حصرية لفتح خطوط بضائع جديدة بمخزنك</p>
                <div class="card-grid">
                    <div class="info-card">
                        <div class="card-title">عقد توريد منتجات ألبان 🧀</div>
                        <div>رسوم توقيع العقد: <b>30,000 ج.م</b></div>
                        <div>الحالة: ${gameState.signedContracts.dairy ? '<b style="color:var(--accent-green)">موقع ومفعل</b>' : 'غير موقع'}</div>
                        <button class="action-btn buy-btn" ${gameState.signedContracts.dairy ? 'disabled' : ''} onclick="signContract('dairy', 30000)">توقيع عقد الألبان</button>
                    </div>
                    <div class="info-card">
                        <div class="card-title">عقد توريد المنظفات 🧼</div>
                        <div>رسوم توقيع العقد: <b>50,000 ج.م</b></div>
                        <div>الحالة: ${gameState.signedContracts.cleaners ? '<b style="color:var(--accent-green)">موقع ومفعل</b>' : 'غير موقع'}</div>
                        <button class="action-btn buy-btn" ${gameState.signedContracts.cleaners ? 'disabled' : ''} onclick="signContract('cleaners', 50000)">توقيع عقد المنظفات</button>
                    </div>
                </div>
            `;
        }
        else if(tabName === 'deals') {
            let dealsHTML = '';
            const availableTrucks = getAvailableTrucks();

            gameState.marketDeals.forEach(deal => {
                dealsHTML += `
                    <div class="info-card">
                        <div class="card-title">🤝 طلب من: ${deal.client}</div>
                        <div>المحافظة: <b>${deal.govName}</b></div>
                        <div>مدة التوصيل بالشاحنة: <b style="color:var(--accent-blue);">${deal.deliveryTime} ثانية</b></div>
                        <div>المنتج المطلوب: <b>${deal.productName} (${deal.qty} كرتونة)</b></div>
                        <div>العائد الإجمالي: <b style="color:var(--accent-green);">${deal.totalRevenue.toLocaleString()} ج.م</b></div>
                        <button class="action-btn buy-btn" ${availableTrucks <= 0 ? 'disabled' : ''} onclick="executeManualDeal(${deal.id})">
                            ${availableTrucks <= 0 ? 'الشاحنات مشغولة' : 'إرسال شاحنة للطلب'}
                        </button>
                    </div>
                `;
            });

            content.innerHTML = `
                <h2>🤝 السوق والصفقات الحية</h2>
                <p style="color:var(--text-muted);">صفقات تظهر تلقائياً بناءً على عقودك وتنشيطك للمحافظات (تتطلب شاحنة وسائق متاحين)</p>
                <div class="card-grid">
                    ${dealsHTML || '<p style="color:var(--text-muted);">لا توجد صفقات معروضة حالياً. تأكد من توقيع العقود وتأسيس المقر الرئيسي.</p>'}
                </div>
            `;
        }
        else if(tabName === 'settings') {
            content.innerHTML = `
                <h2>🛡️ أمان وحفظ البيانات</h2>
                <p style="color:var(--text-muted);">احفظ تقدمك يدويًا أو استعد ملفات الحفظ</p>
                <div class="card-grid">
                    <div class="info-card">
                        <div class="card-title">حفظ اللعبة يدويًا 💾</div>
                        <div>احفظ وضعك التجاري الحالي يدوياً لضمان عدم فقدانه.</div>
                        <button class="action-btn buy-btn" onclick="saveGameData(true)">حفظ الآن</button>
                    </div>
                    <div class="info-card">
                        <div class="card-title">إعادة ضبط اللعبة ⚠️</div>
                        <div>إعادة بدء اللعبة من جديد ومسح كافة التقدم المخزن.</div>
                        <button class="action-btn danger-btn" onclick="resetGameData()">مسح وبدء من جديد</button>
                    </div>
                </div>
            `;
        }
    }

    function saveGameData(manual = false) {
        try {
            gameState.lastSavedTime = Date.now();
            const dataStr = JSON.stringify(gameState);
            localStorage.setItem(SAVE_KEY_PRIMARY, dataStr);
            localStorage.setItem(SAVE_KEY_BACKUP, dataStr);
            if(manual) showToast("تم حفظ بيانات الشركة بنجاح! 💾", "success");
        } catch(e) {
            console.error("Save error", e);
        }
    }

    function loadGameData(manual = false) {
        try {
            const primary = localStorage.getItem(SAVE_KEY_PRIMARY);
            const backup = localStorage.getItem(SAVE_KEY_BACKUP);
            const raw = primary || backup;

            if(raw) {
                const parsed = JSON.parse(raw);
                gameState = Object.assign({}, defaultGameState, parsed);
                document.getElementById('name-modal').classList.add('hidden');
                document.getElementById('dashboard-screen').classList.remove('hidden');
                updateUI();
                showTab(gameState.currentTab || 'admin');
                if(manual) showToast("تم تحميل بيانات الحفظ بنجاح!", "success");
                return true;
            }
        } catch(e) {
            console.error("Load error", e);
        }
        return false;
    }

    function resetGameData() {
        if(confirm("هل أنت تأكد من رغبتك في مسح تقدمك بالكامل والبدء من جديد؟")) {
            localStorage.removeItem(SAVE_KEY_PRIMARY);
            localStorage.removeItem(SAVE_KEY_BACKUP);
            location.reload();
        }
    }
</script>

</body>
</html>
